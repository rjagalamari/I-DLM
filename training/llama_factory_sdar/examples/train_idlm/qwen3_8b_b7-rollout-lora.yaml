# ============================================================================
# Arm B — K=2 rollout only (no hidden-state carry) LoRA at block_size=7
# Matched to arms A/C except relay_enable + relay_rollout_only.
# ============================================================================

### model
# PLACEHOLDER: replace with the Unity path to the released I-DLM-8B / Ram baseline checkpoint.
model_name_or_path: ../model/Qwen3-8B-b7-allmasked
train_from_scratch: false
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 128
lora_alpha: 256
lora_target: all
lora_dropout: 0.0

### dataset
dataset: open_thoughts3_sample
template: qwen3
pretokenized: false
cutoff_len: 4096
block_length: 7
truncate_mode: cut
overwrite_cache: false
preprocessing_num_workers: 4
dataloader_num_workers: 4

### introspective training loss
ce_alpha: 0.2
idlm_loss_type: ar
loss_auto_balance: true
relay_enable: true
relay_rollout_only: true

### output
output_dir: ../output/idlm_qwen3_8b_b7_rollout_lora
logging_steps: 5
save_steps: 250
save_total_limit: 10
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb
wandb_project: idlm-training

### train
run_name: idlm_qwen3_8b_b7_rollout_lora
seed: 42
include_effective_tokens_per_second: true
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
max_steps: 500
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
